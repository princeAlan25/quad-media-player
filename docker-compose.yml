services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    env_file:
      - ./backend/.env.example
    environment:
      - PORT=7000
      - FRONTEND_ORIGIN=http://localhost:3000
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./agentic-gallery
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:7000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
