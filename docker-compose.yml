version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    environment:
      - NODE_ENV=production
      - PORT=7000
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_MAX_REQUESTS=100
    env_file:
      - ./backend/.env.example
    volumes:
      # Only mount the app data directory, not the entire home directory
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./agentic-gallery
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:7000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  backend_data:
    driver: local
