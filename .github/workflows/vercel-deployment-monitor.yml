name: Vercel Deployment Monitor

on:
  deployment_status:

permissions:
  pull-requests: read
  deployments: read
  contents: read
  statuses: write

jobs:

  # ─────────────────────────────────────────────
  # Preview Deployment → Dispatch Smoke Suite
  # ─────────────────────────────────────────────

  dispatch-preview-smoke:
    name: Dispatch Preview Smoke Suite
    runs-on: ubuntu-latest

    if: >
      contains(
        fromJSON('["success","failure","error"]'),
        github.event.deployment_status.state
      )

    outputs:
      should_wait: ${{ steps.pr.outputs.should_wait }}

    steps:

      - name: Resolve associated Pull Request
        id: pr

        uses: actions/github-script@v7

        with:
          script: |
            const sha =
              context.payload.deployment.sha;

            const { data: pulls } =
              await github.rest.repos
                .listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: sha,
                });

            if (pulls.length === 0) {

              core.setOutput(
                'should_wait',
                'false'
              );

              return;
            }

            const pr = pulls[0];

            core.setOutput(
              'should_wait',
              'true'
            );

            core.setOutput(
              'number',
              String(pr.number)
            );

            core.setOutput(
              'title',
              pr.title
            );

            core.setOutput(
              'author',
              pr.user.login
            );

            core.setOutput(
              'url',
              pr.html_url
            );

      - name: Mark QA smoke suite as pending

        if: >
          steps.pr.outputs.should_wait == 'true'

        uses: actions/github-script@v7

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            await github.rest.repos
              .createCommitStatus({

                owner: context.repo.owner,
                repo: context.repo.repo,

                sha:
                  context.payload.deployment.sha,

                state: 'pending',

                context:
                  'Learnershood QA / smoke',

                description:
                  'Waiting for QA smoke suite...',

                target_url:
                  'https://github.com/princeAlan25/learnershood-quality/actions',
              });

      - name: Build smoke payload

        if: >
          steps.pr.outputs.should_wait == 'true'

        id: payload

        shell: bash

        run: |

          STATE="${{ github.event.deployment_status.state }}"
          SHA="${{ github.event.deployment.sha }}"
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)

          ENVIRONMENT="${{ github.event.deployment.environment }}"
          BRANCH="${{ github.head_ref || github.ref_name }}"

          DEPLOYMENT_URL="${{ github.event.deployment_status.target_url }}"

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)

          {
            echo "json<<${EOF}"

            jq -n \
              --arg deployment_status "$STATE" \
              --arg deployment_environment "$ENVIRONMENT" \
              --arg deployment_url "$DEPLOYMENT_URL" \
              --arg deployment_branch "$BRANCH" \
              --arg deployment_sha "$SHA" \
              --arg deployment_short_sha "$SHORT_SHA" \
              --arg pr_number "${{ steps.pr.outputs.number }}" \
              --arg pr_title "${{ steps.pr.outputs.title }}" \
              --arg pr_author "${{ steps.pr.outputs.author }}" \
              --arg pr_url "${{ steps.pr.outputs.url }}" \
              --arg repository_owner "${{ github.repository_owner }}" \
              --arg repository_name "${{ github.repository }}" \
              '{
                deployment: {
                  status: $deployment_status,
                  environment: $deployment_environment,
                  url: $deployment_url,
                  branch: $deployment_branch,
                  sha: $deployment_sha,
                  short_sha: $deployment_short_sha
                },

                pull_request: {
                  number: $pr_number,
                  title: $pr_title,
                  author: $pr_author,
                  url: $pr_url
                },

                repository: {
                  owner: $repository_owner,
                  full_name: $repository_name
                },

                suite: {
                  name: "smoke",
                  trigger: "preview",
                  mode: "blocking"
                }
              }'

            echo "${EOF}"

          } >> "$GITHUB_OUTPUT"

      - name: Dispatch smoke suite

        if: >
          steps.pr.outputs.should_wait == 'true'

        uses: peter-evans/repository-dispatch@v3

        with:
          token: ${{ secrets.QA_DISPATCH_TOKEN }}

          repository: princeAlan25/learnershood-quality

          event-type: product-pr-preview-ready

          client-payload: ${{ steps.payload.outputs.json }}

  # ─────────────────────────────────────────────
  # WAIT FOR QA STATUS
  # ─────────────────────────────────────────────

  wait-for-qa:
    name: Wait For QA Smoke Result

    runs-on: ubuntu-latest

    needs:
      - dispatch-preview-smoke

    if: >
      needs.dispatch-preview-smoke.outputs.should_wait == 'true'

    steps:

      - name: Wait for QA smoke status

        uses: actions/github-script@v7

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const owner =
              context.repo.owner;

            const repo =
              context.repo.repo;

            const sha =
              context.payload.deployment.sha;

            const expectedContext =
              'Learnershood QA / smoke';

            const timeoutMs =
              1000 * 60 * 30;

            const pollIntervalMs =
              15000;

            const startedAt =
              Date.now();

            while (true) {

              const response =
                await github.rest.repos
                  .listCommitStatusesForRef({
                    owner,
                    repo,
                    ref: sha,
                  });

              const statuses =
                response.data;

              const qaStatus =
                statuses.find(status =>
                  status.context === expectedContext
                );

              if (qaStatus) {

                console.log(
                  `QA status: ${qaStatus.state}`
                );

                if (
                  qaStatus.state === 'success'
                ) {

                  core.notice(
                    'QA smoke suite passed.'
                  );

                  return;
                }

                if (
                  qaStatus.state === 'failure' ||
                  qaStatus.state === 'error'
                ) {

                  core.setFailed(
                    qaStatus.description ||
                    'QA smoke suite failed.'
                  );

                  return;
                }
              }

              const elapsed =
                Date.now() - startedAt;

              if (elapsed > timeoutMs) {

                core.setFailed(
                  'Timed out waiting for QA smoke suite.'
                );

                return;
              }

              console.log(
                'Waiting for QA result...'
              );

              await new Promise(resolve =>
                setTimeout(
                  resolve,
                  pollIntervalMs
                )
              );
            }
