name: Learnershood QA Gate

# ─────────────────────────────────────────────────────────────────────────────
# The ONLY workflow the Learnershood QA system needs in the product repo.
# Listens to Vercel deployment_status events and dispatches one of three
# event types to the QA repo (princeAlan25/learnershood-quality):
#
#   product-pr-preview-ready   — PR preview deploy ready → smoke suite
#   product-staging-ready      — staging deploy succeeded → full suite
#   product-post-deploy-ready  — production deploy succeeded → read-only smoke
#
# Place this file at .github/workflows/learnershood-qa.yml.
# Required secrets in the product repo:
#   - QA_DISPATCH_TOKEN: fine-grained PAT with Contents: read + Actions:
#     write on the QA repo.
# ─────────────────────────────────────────────────────────────────────────────

on:
  deployment_status:

permissions:
  pull-requests: read
  deployments: read
  contents: read
  statuses: write

env:
  QA_REPO: princeAlan25/learnershood-quality
  QA_RUN_LANDING: https://github.com/princeAlan25/learnershood-quality/actions

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Resolve PR from SHA (shared by every dispatch job)
  # ───────────────────────────────────────────────────────────────────────
  resolve-pr:
    runs-on: ubuntu-latest
    outputs:
      found:  ${{ steps.pr.outputs.found }}
      merged: ${{ steps.pr.outputs.merged }}
      number: ${{ steps.pr.outputs.number }}
      title:  ${{ steps.pr.outputs.title }}
      author: ${{ steps.pr.outputs.author }}
      url:    ${{ steps.pr.outputs.url }}

    steps:
      - name: Resolve PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.deployment.sha;
            const { data: pulls } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
              });
            if (!pulls.length) {
              core.setOutput("found", "false");
              return;
            }
            const pr = pulls[0];
            core.setOutput("found",  "true");
            core.setOutput("merged", pr.merged_at ? "true" : "false");
            core.setOutput("number", String(pr.number));
            core.setOutput("title",  pr.title);
            core.setOutput("author", pr.user.login);
            core.setOutput("url",    pr.html_url);

  # ───────────────────────────────────────────────────────────────────────
  # PR preview deploy → smoke suite
  # ───────────────────────────────────────────────────────────────────────
  preview-smoke:
    runs-on: ubuntu-latest
    needs: resolve-pr

    if: >
      contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state)
      && needs.resolve-pr.outputs.found == 'true'
      && needs.resolve-pr.outputs.merged != 'true'
      && !contains(github.event.deployment.environment, 'staging')
      && !contains(github.event.deployment.environment, 'Staging')
      && !contains(github.event.deployment.environment, 'production')
      && !contains(github.event.deployment.environment, 'Production')

    steps:
      - name: Mark pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              sha:   context.payload.deployment.sha,
              state: "pending",
              context: "Learnershood QA / smoke",
              description: "Smoke suite running...",
              target_url: process.env.QA_RUN_LANDING || "https://github.com",
            });
        env:
          QA_RUN_LANDING: ${{ env.QA_RUN_LANDING }}

      - name: Dispatch smoke suite
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.QA_DISPATCH_TOKEN }}
          repository: ${{ env.QA_REPO }}
          event-type: product-pr-preview-ready
          client-payload: |
            {
              "deployment": {
                "status":      "${{ github.event.deployment_status.state }}",
                "environment": "${{ github.event.deployment.environment }}",
                "url":         "${{ github.event.deployment_status.target_url }}",
                "sha":         "${{ github.event.deployment.sha }}",
                "short_sha":   "${{ github.event.deployment.sha }}",
                "branch":      "${{ github.event.deployment.ref }}"
              },
              "pull_request": {
                "number": "${{ needs.resolve-pr.outputs.number }}",
                "title":  "${{ needs.resolve-pr.outputs.title }}",
                "author": "${{ needs.resolve-pr.outputs.author }}",
                "url":    "${{ needs.resolve-pr.outputs.url }}"
              },
              "repository": {
                "owner":     "${{ github.repository_owner }}",
                "full_name": "${{ github.repository }}"
              },
              "suite": {
                "name":    "smoke",
                "trigger": "preview"
              },
              "notification": {
                "message": "${{ github.event.deployment.description }}"
              }
            }

  # ───────────────────────────────────────────────────────────────────────
  # Staging deploy → full suite
  # Fires when the environment name contains "staging" AND the deploy
  # succeeded. Whether the PR is merged or not is intentionally not
  # checked — staging can be a long-lived branch.
  # ───────────────────────────────────────────────────────────────────────
  staging:
    runs-on: ubuntu-latest
    needs: resolve-pr

    if: >
      github.event.deployment_status.state == 'success'
      && (
        contains(github.event.deployment.environment, 'staging')
        || contains(github.event.deployment.environment, 'Staging')
      )

    steps:
      - name: Mark pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              sha:   context.payload.deployment.sha,
              state: "pending",
              context: "Learnershood QA / staging",
              description: "Staging full suite running...",
              target_url: process.env.QA_RUN_LANDING || "https://github.com",
            });
        env:
          QA_RUN_LANDING: ${{ env.QA_RUN_LANDING }}

      - name: Dispatch staging suite
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.QA_DISPATCH_TOKEN }}
          repository: ${{ env.QA_REPO }}
          event-type: product-staging-ready
          client-payload: |
            {
              "deployment": {
                "environment": "${{ github.event.deployment.environment }}",
                "url":         "${{ github.event.deployment_status.target_url }}",
                "sha":         "${{ github.event.deployment.sha }}",
                "branch":      "${{ github.event.deployment.ref }}"
              },
              "pull_request": {
                "number": "${{ needs.resolve-pr.outputs.number }}",
                "title":  "${{ needs.resolve-pr.outputs.title }}",
                "author": "${{ needs.resolve-pr.outputs.author }}",
                "url":    "${{ needs.resolve-pr.outputs.url }}"
              },
              "repository": {
                "owner":     "${{ github.repository_owner }}",
                "full_name": "${{ github.repository }}"
              },
              "suite": {
                "name":    "full",
                "trigger": "staging"
              },
              "notification": {
                "message": "${{ github.event.deployment.description }}"
              }
            }

  # ───────────────────────────────────────────────────────────────────────
  # Production deploy → read-only smoke
  # ───────────────────────────────────────────────────────────────────────
  post-deploy:
    runs-on: ubuntu-latest
    needs: resolve-pr

    if: >
      github.event.deployment_status.state == 'success'
      && (
        contains(github.event.deployment.environment, 'production')
        || contains(github.event.deployment.environment, 'Production')
      )
      && needs.resolve-pr.outputs.found == 'true'
      && needs.resolve-pr.outputs.merged == 'true'

    steps:
      - name: Mark pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              sha:   context.payload.deployment.sha,
              state: "pending",
              context: "Learnershood QA / post-deploy",
              description: "Post-deploy suite running...",
              target_url: process.env.QA_RUN_LANDING || "https://github.com",
            });
        env:
          QA_RUN_LANDING: ${{ env.QA_RUN_LANDING }}

      - name: Dispatch post deploy suite
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.QA_DISPATCH_TOKEN }}
          repository: ${{ env.QA_REPO }}
          event-type: product-post-deploy-ready
          client-payload: |
            {
              "deployment": {
                "environment": "${{ github.event.deployment.environment }}",
                "url":         "${{ github.event.deployment_status.target_url }}",
                "sha":         "${{ github.event.deployment.sha }}",
                "short_sha":   "${{ github.event.deployment.sha }}",
                "branch":      "${{ github.event.deployment.ref }}"
              },
              "pull_request": {
                "number": "${{ needs.resolve-pr.outputs.number }}",
                "title":  "${{ needs.resolve-pr.outputs.title }}",
                "author": "${{ needs.resolve-pr.outputs.author }}",
                "url":    "${{ needs.resolve-pr.outputs.url }}"
              },
              "repository": {
                "owner":     "${{ github.repository_owner }}",
                "full_name": "${{ github.repository }}"
              },
              "suite": {
                "name":    "post-deploy",
                "trigger": "production"
              },
              "notification": {
                "message": "${{ github.event.deployment.description }}"
              }
            }
